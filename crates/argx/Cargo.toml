[package]
name = "argx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Expressive command-line parsing and configuration for Rust."
license.workspace = true
readme.workspace = true
repository.workspace = true
documentation = "https://docs.rs/argx"
keywords = ["cli", "configuration", "schema"]
categories = ["command-line-interface", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--show-type-layout",
]

[lints]
workspace = true

[features]
default = ["derive"]
derive = ["dep:argx-derive"]
json = ["dep:serde_json"]
schema = ["json", "dep:schemars", "argx-derive?/schema"]
chrono = ["schema", "schemars/chrono04"]
url = ["schema", "schemars/url2"]
uuid = ["schema", "schemars/uuid1"]
toml = ["derive", "dep:toml_edit", "argx-derive/toml"]

[dependencies]
# Vendor
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
toml_edit = { workspace = true, optional = true }

# Crates
argx-derive = { workspace = true, optional = true }

[dev-dependencies]
# Vendor
serde_json.workspace = true
snapbox.workspace = true

[[example]]
name = "schema"
required-features = ["derive", "schema"]

[[example]]
name = "complete"
required-features = ["derive", "schema"]
